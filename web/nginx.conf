# nginx de TransPort: sirve la web compilada por Vite (dist/) y reenvía /api al contenedor de Node.

map $uri $control_cache {
    ~^/assets/              "public, max-age=31536000, immutable";
    /index.html             "no-cache";
    /sw.js                  "no-cache";
    /manifest.webmanifest   "no-cache";
    default                 "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Importación de CSV/EDI (la API acepta hasta 2 MB)
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/csv;

    add_header Cache-Control $control_cache;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
